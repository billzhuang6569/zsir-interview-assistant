name: server
on:
  push:
    branches: [claude, 'cl/**']
    paths:
      - 'server/**'
      - 'control/**'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [claude]
    paths:
      - 'server/**'
      - 'control/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm install
        working-directory: control
      - run: npm run build
        working-directory: control
      - run: npm test --if-present
        working-directory: control
