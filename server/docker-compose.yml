services:
  relay:
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      DB_PATH: /app/data/relay.sqlite
    volumes:
      - relay-data:/app/data
    restart: unless-stopped
volumes:
  relay-data:
